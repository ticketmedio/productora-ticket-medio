<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1280px;height:720px;overflow:hidden}
body{position:relative;font-family:"Permanent Marker",cursive;background:#141414}
.fondo{position:absolute;inset:0;background:url(../fondos/fachada.png) center/cover;filter:brightness(.55) saturate(1.1)}
.vineta{position:absolute;inset:0;background:radial-gradient(circle at 70% 60%,rgba(0,0,0,0) 0,rgba(0,0,0,.55) 75%)}
.t1{position:absolute;left:34px;top:22px;font-size:108px;line-height:.95;color:#FFFDF6;transform:rotate(-3deg);

.moneda{position:absolute;left:250px;top:330px;width:250px;height:250px;border-radius:50%;background:#F5B301;border:10px solid #1b1b1b;

.flecha{position:absolute;left:520px;top:380px}
