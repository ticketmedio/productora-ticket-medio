<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden}
body{position:relative;font-family:"Permanent Marker",cursive;background:#141414}
.fondo{position:absolute;inset:0;background:url(../fondos/administracion_loteria.jpeg) center/cover;filter:brightness(.5) saturate(1.1)}
.vineta{position:absolute;inset:0;background:radial-gradient(circle at 70% 60%,rgba(0,0,0,0) 0,rgba(0,0,0,.55) 75%)}
.t1{position:absolute;left:34px;top:22px;font-size:100px;line-height:.95;color:#FFFDF6;transform:rotate(-3deg);text-shadow:-6px -6px 0 #1b1b1b,6px -6px 0 #1b1b1b,-6px 6px 0 #1b1b1b,6px 6px 0 #1b1b1b,0 8px 0 #1b1b1b,10px 14px 0 rgba(0,0,0,.45)}
.t1 b{color:#FFD23F;font-weight:400}
.masc{position:absolute;right:20px;bottom:-30px;height:470px;filter:drop-shadow(0 16px 10px rgba(0,0,0,.55));transform:rotate(3deg)}
.m{position:absolute;left:60px;top:370px;width:330px;height:260px;border-radius:50%;background:#8FD18F;border:10px solid #1b1b1b;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1b1b;transform:rotate(-6deg);box-shadow:12px 14px 0 rgba(0,0,0,.45)}
.m span{font-size:30px;line-height:1}.m i{font-style:normal;font-size:96px;line-height:1.05}
.m2{left:430px;top:400px;width:260px;height:260px;background:#FF5A36;color:#FFFDF6;transform:rotate(7deg)}
.m2 i{font-size:62px}
.stripe{position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(-45deg,#F5B301 0 18px,#1b1b1b 18px 36px)}
.tag{position:absolute;left:60px;bottom:40px;background:#FFFDF6;border:6px solid #1b1b1b;border-radius:14px;padding:4px 22px;font-size:42px;transform:rotate(-2deg);color:#1b1b1b;white-space:nowrap}
</style></head><body>
<div class="fondo"></div><div class="vineta"></div>
<div class="t1">¿QUIÉN GANA<br><b>SIEMPRE</b>?</div>
<div class="m"><span>un décimo</span><i>20 €</i></div>
<div class="m m2"><span>de media</span><i>14 €</i></div>
<img class="masc" src="../../marca/mascota/recortes/moneda.png">
<div class="tag">Lotería de Navidad · los números</div>
<div class="stripe"></div>
</body></html>
