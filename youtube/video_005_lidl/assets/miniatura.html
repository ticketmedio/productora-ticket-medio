<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1280px;height:720px;overflow:hidden}
body{position:relative;font-family:"Permanent Marker",cursive;background:#141414}
.fondo{position:absolute;inset:0;background:url(../fondos/supermercado.png) center/cover;filter:brightness(.6) saturate(1.1)}
.vineta{position:absolute;inset:0;background:radial-gradient(circle at 70% 60%,rgba(0,0,0,0) 0,rgba(0,0,0,.55) 75%)}
.t1{position:absolute;left:34px;top:22px;font-size:100px;line-height:.95;color:#FFFDF6;transform:rotate(-3deg);
  text-shadow:-6px -6px 0 #1b1b1b,6px -6px 0 #1b1b1b,-6px 6px 0 #1b1b1b,6px 6px 0 #1b1b1b,0 8px 0 #1b1b1b,10px 14px 0 rgba(0,0,0,.45)}
.t1 b{color:#FF5A36;font-weight:400}
.masc{position:absolute;right:20px;bottom:-30px;height:470px;filter:drop-shadow(0 16px 10px rgba(0,0,0,.55));transform:rotate(3deg)}
.m{position:absolute;width:230px;height:230px;border-radius:50%;border:10px solid #1b1b1b;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1b1b;box-shadow:12px 14px 0 rgba(0,0,0,.45)}
.m span{font-size:26px;line-height:1}.m i{font-style:normal;font-size:66px;line-height:1.05}
.m1{left:60px;top:340px;background:#F5B301;transform:rotate(-8deg)}
.m2{left:420px;top:360px;background:#FF5A36;transform:rotate(6deg);color:#FFFDF6}
.mayor{position:absolute;left:300px;top:420px;font-size:110px;color:#FFFDF6;text-shadow:-5px -5px 0 #1b1b1b,5px -5px 0 #1b1b1b,-5px 5px 0 #1b1b1b,5px 5px 0 #1b1b1b;z-index:3}
.stripe{position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(-45deg,#F5B301 0 18px,#1b1b1b 18px 36px)}
.tag{position:absolute;left:60px;bottom:40px;background:#FFFDF6;border:6px solid #1b1b1b;border-radius:14px;padding:4px 22px;font-size:44px;transform:rotate(-2deg);color:#1b1b1b;white-space:nowrap}
</style></head><body>
<div class="fondo"></div><div class="vineta"></div>
<div class="t1">¿COMPRA MÁS<br>DE LO QUE <b>VENDE</b>?</div>
<div class="m m1"><span>vende</span><i>7.641</i><span>M€</span></div>
<div class="mayor">&lt;</div>
<div class="m m2"><span>compra</span><i>8.400</i><span>M€</span></div>
<img class="masc" src="../../marca/mascota/recortes/carrito.png">
<div class="tag">el truco alemán de LIDL</div>
<div class="stripe"></div>
</body></html>
